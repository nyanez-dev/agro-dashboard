<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Allaria Agro — Soja Sustentable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#F0F2F5;min-height:100vh}

/* Header */
.hdr{background:#1B2A4A;padding:0}
.hdr-top{display:flex;align-items:center;justify-content:space-between;padding:14px 24px}
.hdr-brand{display:flex;flex-direction:column}
.hdr-brand-name{color:#C9A96E;font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase}
.hdr-brand-title{color:#fff;font-size:16px;font-weight:500}
.hdr-meta{display:flex;align-items:center;gap:16px;color:#7B8BA3;font-size:11px}
.hdr-tabs{display:flex;gap:0;padding:0 24px}
.tab{padding:10px 20px;border:none;background:transparent;cursor:pointer;font-size:13px;color:#7B8BA3;border-bottom:2px solid transparent;font-family:'Inter',sans-serif;transition:all 0.15s}
.tab:hover{color:#A0B0C4}
.tab.active{color:#fff;font-weight:500}
.tab.active[data-color="navy"]{border-bottom-color:#C9A96E}
.tab.active[data-color="blue"]{border-bottom-color:#60A5FA}
.tab.active[data-color="indigo"]{border-bottom-color:#818CF8}

/* Action bar */
.action-bar{background:#F7F8FA;border-bottom:1px solid #E5E7EB;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.action-bar .btn-group{display:flex;gap:8px}
.btn{padding:7px 16px;border-radius:6px;font-size:12px;font-family:'Inter',sans-serif;cursor:pointer;border:1px solid #D1D5DB;background:#fff;color:#1B2A4A;font-weight:500;transition:background 0.15s}
.btn:hover{background:#F3F4F6}
.btn-primary{background:#1B2A4A;color:#fff;border-color:#1B2A4A}
.btn-primary:hover{background:#243656}
.btn-gold{background:#C9A96E;color:#1B2A4A;border-color:#C9A96E;font-weight:600}
.btn-gold:hover{background:#B8985D}
.btn-edit{border-color:#D1D5DB}
.btn-edit.active{background:#DC2626;color:#fff;border-color:#DC2626}

/* Content */
.content{max-width:1400px;margin:0 auto;padding:24px}

/* Section bar */
.section-bar{font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;padding:9px 16px;border-radius:6px 6px 0 0;display:flex;justify-content:space-between;color:#fff}
.section-bar.navy{background:#1B2A4A}
.section-bar.navy .count{color:#C9A96E}
.section-bar.blue{background:#1E40AF}
.section-bar.blue .count{color:#BFDBFE}
.section-bar.indigo{background:#4338CA}
.section-bar.indigo .count{color:#C7D2FE}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px}
.stat{background:#F7F8FA;border-radius:8px;padding:16px;border-left:3px solid #1B2A4A}
.stat-val{font-size:24px;font-weight:500;color:#1B2A4A;margin-top:4px}
.stat-lbl{font-size:11px;color:#6B7280;text-transform:uppercase;letter-spacing:0.06em}

/* Filters */
.filters-wrap{background:#F7F8FA;padding:14px 16px;border:1px solid #E5E7EB;border-top:none;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filter-group{display:flex;flex-direction:column;gap:4px}
.filter-group label{font-size:10px;color:#9CA3AF;text-transform:uppercase;letter-spacing:0.06em;font-weight:600}
input[type=text]{padding:8px 12px;border-radius:6px;border:1px solid #D1D5DB;font-size:13px;color:#374151;background:#fff;outline:none;font-family:'Inter',sans-serif;width:220px}
input[type=text]:focus{border-color:#1B2A4A}

/* Multi-select */
.multi-select-wrap{position:relative;min-width:140px}
.multi-select-btn{width:100%;padding:8px 12px;border-radius:6px;border:1px solid #D1D5DB;font-size:13px;color:#374151;background:#fff;outline:none;font-family:'Inter',sans-serif;cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:6px;white-space:nowrap;overflow:hidden}
.multi-select-btn:focus,.multi-select-btn.open{border-color:#1B2A4A}
.multi-select-btn .arrow{font-size:10px;color:#9CA3AF;flex-shrink:0}
.multi-select-dropdown{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:100;background:#fff;border:1px solid #E5E7EB;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,0.08);min-width:100%;max-height:none;overflow:visible;padding:0}
.multi-select-dropdown.open{display:block}
.multi-select-option{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;font-size:13px;color:#374151;user-select:none}
.multi-select-option:hover{background:#F0F7FF}
.multi-select-option input[type=checkbox]{accent-color:#1B2A4A;width:14px;height:14px;cursor:pointer}
.drop-header{display:flex;align-items:center;justify-content:space-between;padding:6px 12px 4px;border-bottom:1px solid #F3F4F6;gap:8px}
.drop-search{flex:1;padding:5px 8px;border-radius:6px;border:1px solid #E5E7EB;font-size:12px;font-family:'Inter',sans-serif;outline:none;color:#374151}
.drop-search:focus{border-color:#1B2A4A}
.drop-clear-btn{font-size:11px;color:#9CA3AF;background:none;border:none;cursor:pointer;white-space:nowrap;padding:2px 4px}
.drop-clear-btn:hover{color:#DC2626}
.drop-options{max-height:200px;overflow-y:auto}

.btn-clear{padding:7px 14px;border-radius:6px;border:1px solid #D1D5DB;background:#fff;color:#6B7280;cursor:pointer;font-size:12px;font-family:'Inter',sans-serif;align-self:flex-end}
.btn-clear:hover{background:#F3F4F6}

/* Table */
.table-wrap{border:1px solid #E5E7EB;border-top:none;border-radius:0 0 6px 6px;overflow:hidden;overflow-x:auto;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:auto}
#panel-e table,#panel-c table{font-size:12px}
th{padding:10px 14px;text-align:left;color:#6B7280;font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;background:#F9FAFB;border-bottom:1px solid #E5E7EB}
td{padding:11px 14px;border-bottom:1px solid #F3F4F6;color:#374151;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:nth-child(even) td{background:#FAFBFC}
tr:hover td{background:#F0F7FF}
tr.clickable{cursor:pointer}

/* Badges */
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-ok{background:#D1FAE5;color:#065F46}
.badge-warn{background:#FEF3C7;color:#92400E}
.badge-err{background:#FEE2E2;color:#991B1B}
.badge-info{background:#DBEAFE;color:#1E40AF}
.badge-na{background:#F3F4F6;color:#6B7280}
.badge-web{background:#EFF6FF;color:#1D4ED8}
.badge-mail{background:#FFFBEB;color:#B45309}

/* Ficha expandida */
.ficha{background:#FAFBFC;border:1px solid #E5E7EB;border-radius:8px;margin:8px 0;padding:20px;display:none}
.ficha.open{display:block}
.ficha-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px}
.ficha-field label{font-size:10px;color:#9CA3AF;text-transform:uppercase;letter-spacing:0.06em;display:block;margin-bottom:3px}
.ficha-field .val{font-size:14px;color:#1B2A4A}
.ficha-field a{color:#2563EB;text-decoration:none;font-size:13px}
.ficha-field a:hover{text-decoration:underline}
.ficha-section{border-top:1px solid #E5E7EB;padding-top:14px;margin-top:14px}
.ficha-section h3{font-size:13px;font-weight:600;color:#1B2A4A;margin-bottom:10px}
.comment-box{background:#fff;border:1px solid #E5E7EB;border-radius:8px;padding:10px;margin-bottom:8px}
.comment-meta{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px}
.comment-author{color:#2563EB;font-weight:600}
.comment-date{color:#9CA3AF}
.comment-text{font-size:13px;color:#374151}
.comment-input{display:flex;gap:8px;margin-top:10px}
.comment-input input{flex:1;padding:8px 12px;border:1px solid #D1D5DB;border-radius:6px;font-size:13px;font-family:'Inter',sans-serif}
.comment-input button{background:#1B2A4A;color:#fff;border:none;border-radius:6px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:500;font-family:'Inter',sans-serif}
.vto-input{display:flex;align-items:center;gap:8px;margin-top:6px}
.vto-input input[type=date]{padding:6px 10px;border:1px solid #D1D5DB;border-radius:6px;font-size:13px;font-family:'Inter',sans-serif}
.vto-input select{padding:6px 10px;border:1px solid #D1D5DB;border-radius:6px;font-size:13px;font-family:'Inter',sans-serif}
.vto-input button{background:#1B2A4A;color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif}
.edit-only{display:none !important}
.edit-mode .edit-only{display:flex !important}
.edit-mode span.edit-only{display:inline !important}

.footer-row{font-size:11px;color:#9CA3AF;margin-top:10px;text-align:right}
.loading{text-align:center;padding:50px;color:#6B7280;font-size:14px}
.error{text-align:center;padding:40px;color:#DC2626;font-size:13px;line-height:1.6}
.num{text-align:right;font-variant-numeric:tabular-nums}
.bold{font-weight:500}
.mono{font-family:monospace;font-size:12px;color:#6B7280}
.muted{color:#6B7280}
.green{color:#065F46}
.warn-box{background:#FEF3C7;border:1px solid #FDE68A;border-radius:6px;padding:10px 14px;font-size:13px;color:#92400E}
</style>
</head>
<body>

<!-- Header -->
<div class="hdr">
  <div class="hdr-top">
    <div class="hdr-brand">
      <span class="hdr-brand-name">Allaria Agro</span>
      <span class="hdr-brand-title">Tablero de control · Soja sustentable</span>
    </div>
    <div class="hdr-meta">
      <span id="last-update">Cargando...</span>
    </div>
  </div>
  <div class="hdr-tabs">
    <button class="tab active" id="tab-g" data-color="navy" onclick="switchTab('g')">Gestiones</button>
    <button class="tab" id="tab-e" data-color="blue" onclick="switchTab('e')">Habilitaciones</button>
    <button class="tab" id="tab-c" data-color="indigo" onclick="switchTab('c')">Información de campos</button>
  </div>
</div>

<!-- Action bar -->
<div class="action-bar">
  <div class="btn-group">
    <a href="https://script.google.com/macros/s/AKfycbwPs67c0Od3Ca0lZH7TkaW_75Rq8pQGvIPFUmsiRCZ4O-n3EvywAFmF8VpuxztO7mc6/exec" target="_blank" class="btn btn-primary" style="text-decoration:none">Formulario cliente</a>
    <button class="btn" onclick="exportExcel()">Exportar Excel</button>
    <button class="btn" onclick="loadData()">Actualizar</button>
  </div>
  <button class="btn btn-edit" id="btn-edit" onclick="toggleEditMode()">Modo edición</button>
</div>

<!-- GESTIONES -->
<div id="panel-g" class="content">
  <div class="stats" id="stats-g"></div>
  <div class="section-bar navy"><span id="section-label-g">Gestiones</span><span class="count" id="section-count-g"></span></div>
  <div class="filters-wrap">
    <div class="filter-group"><label>Campaña</label><div class="multi-select-wrap" id="wrap-g-camp"><button type="button" class="multi-select-btn" onclick="toggleDropdown('g-camp')"><span id="label-g-camp">Todas</span><span class="arrow">&#9660;</span></button><div class="multi-select-dropdown" id="drop-g-camp"></div></div></div>
    <div class="filter-group"><label>Buscar</label><input type="text" id="g-search" placeholder="Productor, campo, estado..." oninput="onFilterG()"></div>
    <div class="filter-group"><label>Exportador</label><div class="multi-select-wrap" id="wrap-g-exp"><button type="button" class="multi-select-btn" onclick="toggleDropdown('g-exp')"><span id="label-g-exp">Todos</span><span class="arrow">&#9660;</span></button><div class="multi-select-dropdown" id="drop-g-exp"></div></div></div>
    <div class="filter-group"><label>Vía</label><div class="multi-select-wrap" id="wrap-g-via"><button type="button" class="multi-select-btn" onclick="toggleDropdown('g-via')"><span id="label-g-via">Todas</span><span class="arrow">&#9660;</span></button><div class="multi-select-dropdown" id="drop-g-via"></div></div></div>
    <button class="btn-clear" onclick="clearG()">Limpiar filtros</button>
  </div>
  <div id="g-table"><div class="loading">Cargando datos...</div></div>
  <div class="footer-row" id="g-footer"></div>
</div>

<!-- HABILITACIONES -->
<div id="panel-e" class="content" style="display:none">
  <div class="stats" id="stats-e"></div>
  <div class="section-bar blue"><span id="section-label-e">Habilitaciones</span><span class="count" id="section-count-e"></span></div>
  <div class="filters-wrap">
    <div class="filter-group"><label>Campaña</label><div class="multi-select-wrap" id="wrap-e-camp"><button type="button" class="multi-select-btn" onclick="toggleDropdown('e-camp')"><span id="label-e-camp">Todas</span><span class="arrow">&#9660;</span></button><div class="multi-select-dropdown" id="drop-e-camp"></div></div></div>
    <div class="filter-group"><label>Buscar</label><input type="text" id="e-search" placeholder="Vendedor, campo, localidad..." oninput="onFilterE()"></div>
    <div class="filter-group"><label>Vendedor</label><div class="multi-select-wrap" id="wrap-e-vend"><button type="button" class="multi-select-btn" onclick="toggleDropdown('e-vend')"><span id="label-e-vend">Todos</span><span class="arrow">&#9660;</span></button><div class="multi-select-dropdown" id="drop-e-vend"></div></div></div>
    <div class="filter-group"><label>Exportador</label><div class="multi-select-wrap" id="wrap-e-exp"><button type="button" class="multi-select-btn" onclick="toggleDropdown('e-exp')"><span id="label-e-exp">Todos</span><span class="arrow">&#9660;</span></button><div class="multi-select-dropdown" id="drop-e-exp"></div></div></div>
    <div class="filter-group"><label>Tipo</label><div class="multi-select-wrap" id="wrap-e-tipo"><button type="button" class="multi-select-btn" onclick="toggleDropdown('e-tipo')"><span id="label-e-tipo">Todos</span><span class="arrow">&#9660;</span></button><div class="multi-select-dropdown" id="drop-e-tipo"></div></div></div>
    <button class="btn-clear" onclick="clearE()">Limpiar filtros</button>
  </div>
  <div id="e-table"><div class="loading">Cargando datos...</div></div>
  <div class="footer-row" id="e-footer"></div>
</div>

<!-- INFORMACIÓN DE CAMPOS -->
<div id="panel-c" class="content" style="display:none">
  <div class="stats" id="stats-c"></div>
  <div class="section-bar indigo"><span id="section-label-c">Información de campos</span><span class="count" id="section-count-c"></span></div>
  <div class="filters-wrap">
    <div class="filter-group"><label>Buscar</label><input type="text" id="c-search" placeholder="Razón social, campo, CUIT..." oninput="renderC()"></div>
    <div class="filter-group"><label>Provincia</label><div class="multi-select-wrap" id="wrap-c-prov"><button type="button" class="multi-select-btn" onclick="toggleDropdown('c-prov')"><span id="label-c-prov">Todas</span><span class="arrow">&#9660;</span></button><div class="multi-select-dropdown" id="drop-c-prov"></div></div></div>
    <div class="filter-group"><label>Estado</label><div class="multi-select-wrap" id="wrap-c-estado"><button type="button" class="multi-select-btn" onclick="toggleDropdown('c-estado')"><span id="label-c-estado">Todos</span><span class="arrow">&#9660;</span></button><div class="multi-select-dropdown" id="drop-c-estado"></div></div></div>
    <button class="btn-clear" onclick="clearC()">Limpiar filtros</button>
  </div>
  <div id="c-table"><div class="loading">Cargando datos...</div></div>
  <div class="footer-row" id="c-footer"></div>
</div>

<script>

const SHEET_ID = '1-yVmx3D5q-liA0twVVcaRWYJicmZpVBAOXrdPX8jAto';
const API_KEY = 'AIzaSyA_PNd_cf9LQVUFKSKXVi7CRINBKbCuUEM';
const APPS_SCRIPT_URL = 'https://script.google.com/a/macros/allariaagro.com.ar/s/AKfycbxPRkT1GSAS5dKLHIA2wHOOOhrz5prERHCt7HH3AaEj-SU3u9-_qhv9Y18LvP1CDCV3Dg/exec';
const CAMP_DEFAULTS = ['2526','25/26'];
function findCampDefault(data){
  const camps=data.map(r=>g(r,'Campa')).filter(Boolean);
  for(const cd of CAMP_DEFAULTS){if(camps.includes(cd))return cd;}
  return camps[camps.length-1]||'';
}
const EDIT_PASSWORD = 'compliance2026';

let allG=[], allE=[], allC=[], allNotas=[];
let currentTab='g', editMode=false;

// Helper para buscar columnas por nombre parcial (maneja nombres con espacios/acentos)
function g(r,partial){const keys=Object.keys(r);const k=keys.find(x=>x.toUpperCase().includes(partial.toUpperCase()));return k?r[k]:'';}
const sel = {'g-camp':new Set(),'g-exp':new Set(),'g-via':new Set(),'e-camp':new Set(),'e-vend':new Set(),'e-exp':new Set(),'e-tipo':new Set(),'c-prov':new Set(),'c-estado':new Set()};

// ── COLORES ──
const TIPO_COLORS = {'EPA':{bg:'#d1fae5',color:'#065f46'},'2BSvs':{bg:'#fee2e2',color:'#991b1b'},'RTRS':{bg:'#ede9fe',color:'#5b21b6'},'ISCC':{bg:'#fef3c7',color:'#92400e'}};
const EXP_COLORS = {'LDC':{bg:'#dbeafe',color:'#1e3a8a'},'MOA':{bg:'#fce7f3',color:'#9d174d'},'COFCO':{bg:'#fef3c7',color:'#78350f'},'Bunge':{bg:'#d1fae5',color:'#064e3b'},'AGD':{bg:'#ede9fe',color:'#4c1d95'},'Dreyfus':{bg:'#ffedd5',color:'#7c2d12'}};

function tipoBadge(t){if(!t)return'\u2014';const c=TIPO_COLORS[t]||{bg:'#f1f5f9',color:'#475569'};return `<span class="badge" style="background:${c.bg};color:${c.color}">${t}</span>`;}
function expBadge(e){if(!e)return'\u2014';const c=EXP_COLORS[e]||{bg:'#f1f5f9',color:'#334155'};return `<span class="badge" style="background:${c.bg};color:${c.color}">${e}</span>`;}
function viaBadge(v){if(!v)return'\u2014';return `<span class="badge ${v.toLowerCase()==='web'?'badge-web':'badge-mail'}">${v}</span>`;}
function statusBadge(s){const m={'Completo':'badge-ok','Falta RENSPA':'badge-err','RENSPA vencida':'badge-warn','Falta evidencia':'badge-err','Falta poligono':'badge-err','Incompleto':'badge-err'};return `<span class="badge ${m[s]||'badge-na'}">${s}</span>`;}

// ── UTILS ──
function toObjs(rows){if(!rows||rows.length<2)return[];const h=rows[0].map(k=>k.replace(/[\n\r]+/g,' ').replace(/\s+/g,' ').trim());return rows.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').toString().trim()])));}
async function fetchSheet(name,startRow){const range=startRow?`${name}!A${startRow}:Z`:`${name}!A:Z`;const url=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}?key=${API_KEY}`;const res=await fetch(url);if(!res.ok)throw new Error('HTTP '+res.status);return toObjs((await res.json()).values||[]);}
function uniq(arr){return[...new Set(arr.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));}
function parseNum(v){if(!v)return 0;const c=typeof v==='string'?v.replace(/,/g,''):v;const n=parseFloat(c);return isNaN(n)?0:n;}
function fmt(v){if(!v)return'\u2014';const clean=typeof v==='string'?v.replace(/,/g,''):v;const n=parseFloat(clean);return isNaN(n)?(v||'\u2014'):n.toLocaleString('es-AR',{maximumFractionDigits:2});}
function fmtCamp(v){if(!v)return'\u2014';const s=String(v);if(s.length===4&&/^\d{4}$/.test(s))return s.slice(0,2)+'/'+s.slice(2);return s;}
function statCard(val,lbl,color){return `<div class="stat"><div class="stat-val" style="color:${color}">${val}</div><div class="stat-lbl">${lbl}</div></div>`;}

// ── EDIT MODE ──
function toggleEditMode(){
  if(!editMode){
    const pw=prompt('Ingresa la contrasena de Compliance:');
    if(pw!==EDIT_PASSWORD){alert('Contrasena incorrecta.');return;}
    editMode=true;
    document.body.classList.add('edit-mode');
    document.getElementById('btn-edit').textContent='Salir de edicion';
    document.getElementById('btn-edit').classList.add('active');
  } else {
    editMode=false;
    document.body.classList.remove('edit-mode');
    document.getElementById('btn-edit').textContent='Modo edicion';
    document.getElementById('btn-edit').classList.remove('active');
  }
}

// ── NOTAS ──
async function loadNotas(){
  return new Promise((resolve)=>{
    const cb='_notasCb'+Date.now();
    window[cb]=function(d){allNotas=d.notas||[];delete window[cb];resolve();};
    const s=document.createElement('script');
    s.src=APPS_SCRIPT_URL+'?callback='+cb;
    s.onerror=function(){console.warn('No se pudieron cargar notas');allNotas=[];resolve();};
    document.body.appendChild(s);
    setTimeout(()=>{if(window[cb]){allNotas=[];delete window[cb];resolve();}},5000);
  });
}
async function saveNota(cuit,campo,tipo,valor,autor){
  return new Promise((resolve)=>{
    const cb='_saveCb'+Date.now();
    window[cb]=function(d){delete window[cb];resolve(d);};
    const params=`action=save&cuit=${encodeURIComponent(cuit)}&campo=${encodeURIComponent(campo)}&tipo=${encodeURIComponent(tipo)}&valor=${encodeURIComponent(valor)}&autor=${encodeURIComponent(autor)}&callback=${cb}`;
    const s=document.createElement('script');
    s.src=APPS_SCRIPT_URL+'?'+params;
    s.onerror=function(){delete window[cb];alert('Error guardando. Reintenta.');resolve();};
    document.body.appendChild(s);
  });
}
function getNotas(cuit,campo,tipo){
  const deleted=allNotas.filter(n=>String(n.CUIT)==String(cuit)&&String(n.CAMPO)==String(campo)&&n.TIPO==='borrar_comentario').map(n=>n.VALOR);
  return allNotas.filter(n=>{
    if(String(n.CUIT)!=String(cuit)||String(n.CAMPO)!=String(campo))return false;
    if(tipo&&n.TIPO!=tipo)return false;
    if(n.TIPO==='comentario'&&deleted.includes(n.VALOR+'|||'+n.FECHA))return false;
    if(n.TIPO==='borrar_comentario')return false;
    return true;
  });
}
function getVtoRenspa(cuit,campo){const n=getNotas(cuit,campo,'vto_renspa');return n.length?n[n.length-1].VALOR:'';}
function getNotaValor(cuit,campo,tipo){const n=getNotas(cuit,campo,tipo);return n.length?n[n.length-1].VALOR:'';}

function fmtDate(v){
  if(!v)return'';
  const s=String(v);
  let d;
  if(s.includes('T'))d=new Date(s);
  else if(s.includes('-')&&s.indexOf('-')===4){const p=s.split('-');d=new Date(p[0],p[1]-1,p[2]);}
  else return s;
  if(!d||isNaN(d))return s;
  const dd=String(d.getDate()).padStart(2,'0');
  const mm=String(d.getMonth()+1).padStart(2,'0');
  const yyyy=d.getFullYear();
  return dd+'/'+mm+'/'+yyyy;
}

function renspaStatus(cuit,campo){
  const vto=getVtoRenspa(cuit,campo);
  if(!vto)return{status:'Sin fecha',cls:'badge-na'};
  const vtoStr=String(vto);
  let d;
  if(vtoStr.includes('T'))d=new Date(vtoStr);
  else{const parts=vtoStr.split(/[-/]/);if(parts[0].length===4)d=new Date(parts[0],parts[1]-1,parts[2]);else d=new Date(parts[2],parts[1]-1,parts[0]);}
  const today=new Date();today.setHours(0,0,0,0);
  const diff=Math.floor((d-today)/(1000*60*60*24));
  const fechaLinda=fmtDate(vto);
  if(diff<0)return{status:'Vencida ('+fechaLinda+')',cls:'badge-err'};
  if(diff<=30)return{status:'Vence pronto ('+fechaLinda+')',cls:'badge-warn'};
  return{status:'Vigente ('+fechaLinda+')',cls:'badge-ok'};
}

    <div class="ficha-field"><label>Estado RENSPA</label><div class="val"><span class="badge ${rs.cls}">${rs.status}</span></div>
      <div class="vto-input edit-only" style="margin-top:6px"><input type="date" id="vto-${idx}" value="${vtoFmt||''}"><button onclick="saveVto(${idx})">Guardar fecha</button></div>
    </div>
    <div class="ficha-field"><label>Poligono KMZ</label>
      <div class="val">${poly?`<a href="${poly}" target="_blank">Descargar KMZ</a>`:'No adjunto'}</div>
      <div class="val" style="margin-top:4px">${estadoBadge(estadoKmz)}</div>
      <div class="vto-input edit-only" style="margin-top:6px"><select id="kmz-${idx}"><option value="">Seleccionar...</option><option value="OK" ${estadoKmz==='OK'?'selected':''}>OK</option><option value="Con observaciones" ${estadoKmz==='Con observaciones'?'selected':''}>Con observaciones</option></select><button onclick="saveEstadoKmz(${idx})">Guardar</button></div>
    </div>
    <div class="ficha-field"><label>Tipo evidencia</label><div class="val">${tipoEvid||'\u2014'}</div></div>
    <div class="ficha-field"><label>Evidencia</label>
      <div class="val">${evid?`<a href="${evid}" target="_blank">Ver evidencia</a>`:'No adjunto'}</div>
      <div class="val" style="margin-top:4px">${estadoBadge(estadoEvid)}</div>
      <div class="vto-input edit-only" style="margin-top:6px"><select id="evid-${idx}"><option value="">Seleccionar...</option><option value="OK" ${estadoEvid==='OK'?'selected':''}>OK</option><option value="Con observaciones" ${estadoEvid==='Con observaciones'?'selected':''}>Con observaciones</option></select><button onclick="saveEstadoEvid(${idx})">Guardar</button></div>
    </div>
    <div class="ficha-field"><label>PCUS 1</label><div class="val">${g(r,'PCUS 1')||'\u2014'}</div></div>
  </div></div>`;

  html+=`<div class="ficha-section"><h3>Comentarios del equipo</h3>`;
  comentarios.forEach((c,ci)=>{html+=`<div class="comment-box"><div class="comment-meta"><span class="comment-author">${c.AUTOR}</span><span class="comment-date">${fmtDate(c.FECHA)||c.FECHA}</span><span class="edit-only" style="display:inline;margin-left:8px"><button onclick="editComment(${idx},${ci})" style="background:none;border:none;color:#1a5a9a;cursor:pointer;font-size:11px;font-family:Inter,sans-serif">Editar</button><button onclick="deleteComment(${idx},${ci})" style="background:none;border:none;color:#dc2626;cursor:pointer;font-size:11px;font-family:Inter,sans-serif">Borrar</button></span></div><div class="comment-text" id="cmtxt-${idx}-${ci}">${c.VALOR}</div></div>`;});
  html+=`<div class="comment-input edit-only"><input type="text" id="cmt-${idx}" placeholder="Escribir comentario..."><button onclick="saveComment(${idx})">Guardar</button></div></div>`;
  return html;
}


function toggleFicha(i){const el=document.getElementById('ficha-'+i);if(el)el.classList.toggle('open');}

async function saveVto(idx){
  const f=filterC();const r=f[idx];if(!r)return;
  const cuit=g(r,'CUIT');const campo=g(r,'NOMBRE DEL CAMPO');
  const val=document.getElementById('vto-'+idx).value;
  if(!val){alert('Selecciona una fecha.');return;}
  await saveNota(cuit,campo,'vto_renspa',val,'Compliance');
  await loadNotas();renderC();
}

async function saveEstadoKmz(idx){
  const f=filterC();const r=f[idx];if(!r)return;
  const cuit=g(r,'CUIT');const campo=g(r,'NOMBRE DEL CAMPO');
  const val=document.getElementById('kmz-'+idx).value;
  if(!val){alert('Selecciona un estado.');return;}
  await saveNota(cuit,campo,'estado_kmz',val,'Compliance');
  await loadNotas();renderC();
}

async function saveEstadoEvid(idx){
  const f=filterC();const r=f[idx];if(!r)return;
  const cuit=g(r,'CUIT');const campo=g(r,'NOMBRE DEL CAMPO');
  const val=document.getElementById('evid-'+idx).value;
  if(!val){alert('Selecciona un estado.');return;}
  await saveNota(cuit,campo,'estado_evidencia',val,'Compliance');
  await loadNotas();renderC();
}

async function saveHas(idx){
  const f=filterC();const r=f[idx];if(!r)return;
  const cuit=g(r,'CUIT');const campo=g(r,'NOMBRE DEL CAMPO');
  const val=document.getElementById('has-'+idx).value.trim();
  if(!val){alert('Ingresa un valor.');return;}
  await saveNota(cuit,campo,'has_sustentables',val,'Compliance');
  await loadNotas();renderC();
}

async function saveComment(idx){
  const f=filterC();const r=f[idx];if(!r)return;
  const cuit=g(r,'CUIT');const campo=g(r,'NOMBRE DEL CAMPO');
  const input=document.getElementById('cmt-'+idx);
  const val=input.value.trim();
  if(!val){alert('Escribi un comentario.');return;}
  const autor=prompt('Tu nombre:');
  if(!autor)return;
  await saveNota(cuit,campo,'comentario',val,autor);
  input.value='';
  await loadNotas();renderC();
}

async function editComment(idx,ci){
  const f=filterC();const r=f[idx];if(!r)return;
  const cuit=g(r,'CUIT');const campo=g(r,'NOMBRE DEL CAMPO');
  const comentarios=getNotas(cuit,campo,'comentario');
  const cmt=comentarios[ci];if(!cmt)return;
  const newVal=prompt('Editar comentario:',cmt.VALOR);
  if(newVal===null||!newVal.trim())return;
  // Save as new comment with same author, delete logic handled by updating
  await saveNota(cuit,campo,'comentario',newVal.trim(),cmt.AUTOR);
  // Mark old one for deletion
  await saveNota(cuit,campo,'borrar_comentario',cmt.VALOR+'|||'+cmt.FECHA,'Sistema');
  await loadNotas();renderC();
}

async function deleteComment(idx,ci){
  if(!confirm('Seguro que queres borrar este comentario?'))return;
  const f=filterC();const r=f[idx];if(!r)return;
  const cuit=g(r,'CUIT');const campo=g(r,'NOMBRE DEL CAMPO');
  const comentarios=getNotas(cuit,campo,'comentario');
  const cmt=comentarios[ci];if(!cmt)return;
  await saveNota(cuit,campo,'borrar_comentario',cmt.VALOR+'|||'+cmt.FECHA,'Sistema');
  await loadNotas();renderC();
}

function clearC(){document.getElementById('c-search').value='';Object.keys(sel).filter(k=>k.startsWith('c-')).forEach(k=>sel[k].clear());buildDropdown('c-prov',uniq(allC.map(r=>g(r,'PROVINCIA'))));buildDropdown('c-estado',uniq(allC.map(r=>getFieldStatus(r))),s=>statusBadge(s));renderC();}

// ── TABS ──
function switchTab(t){currentTab=t;['g','e','c'].forEach(x=>{const tab=document.getElementById('tab-'+x);const cl=x===t?'tab active':'tab';tab.className=cl;document.getElementById('panel-'+x).style.display=x===t?'':'none';});}

// ── EXPORT ──
function exportExcel(){
  let data,name;
  if(currentTab==='g'){data=filterG();name='Gestiones';}
  else if(currentTab==='e'){data=filterE();name='Habilitaciones';}
  else{data=filterC();name='Informacion_Campos';}
  if(!data.length){alert('No hay datos para exportar.');return;}
  const ws=XLSX.utils.json_to_sheet(data);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,name);
  const date=new Date().toLocaleDateString('es-AR').replace(/\//g,'-');
  XLSX.writeFile(wb,`${name}-${date}.xlsx`);
}

// ── CARGA ──
async function loadData(){
  document.getElementById('last-update').textContent='Actualizando...';
  document.getElementById('g-table').innerHTML='<div class="loading">Cargando...</div>';
  document.getElementById('e-table').innerHTML='<div class="loading">Cargando...</div>';
  document.getElementById('c-table').innerHTML='<div class="loading">Cargando...</div>';
  try{
    const [gData,eData,c]=await Promise.all([fetchSheet('Gestiones'),fetchSheet('Exportadores'),fetchSheet('BASE DATOS FINAL',2)]);
    allG=gData;allE=eData;allC=c;
    try{await loadNotas();}catch(e){console.warn('Notas no disponibles:',e);}

    const gDefault=findCampDefault(allG);
    const eDefault=findCampDefault(allE);
    if(gDefault)sel['g-camp'].add(gDefault);
    if(eDefault)sel['e-camp'].add(eDefault);
    buildDropdown('g-camp',uniq(allG.map(r=>g(r,'Campa'))),v=>fmtCamp(v));
    buildDropdown('e-camp',uniq(allE.map(r=>g(r,'Campa'))),v=>fmtCamp(v));
    updateLabel('g-camp');updateLabel('e-camp');
    cascadeG();cascadeE();
    buildDropdown('c-prov',uniq(allC.map(r=>g(r,'PROVINCIA'))));
    buildDropdown('c-estado',uniq(allC.map(r=>getFieldStatus(r))),s=>statusBadge(s));
    renderG();renderE();renderC();
    const now=new Date();
    document.getElementById('last-update').textContent='Actualizado '+now.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    const msg=`<div class="error">No se pudieron cargar los datos.<br><small>${e.message}</small></div>`;
    document.getElementById('g-table').innerHTML=msg;
    document.getElementById('e-table').innerHTML=msg;
    document.getElementById('c-table').innerHTML=msg;
    document.getElementById('last-update').textContent='Error al cargar';
  }
}
loadData();

// ── SECTION BAR UPDATE ──
function updateSectionBars(){
  // Gestiones
  var gCamps=sel['g-camp'];
  var gLabel='Gestiones';
  if(gCamps.size===1)gLabel='Gestiones · Campaña '+fmtCamp([...gCamps][0]);
  else if(gCamps.size>1)gLabel='Gestiones · '+gCamps.size+' campañas';
  document.getElementById('section-label-g').textContent=gLabel;
  var gCount=document.getElementById('g-footer').textContent;
  document.getElementById('section-count-g').textContent=filterG().length+' registros';
  // Habilitaciones
  var eCamps=sel['e-camp'];
  var eLabel='Habilitaciones';
  if(eCamps.size===1)eLabel='Habilitaciones · Campaña '+fmtCamp([...eCamps][0]);
  else if(eCamps.size>1)eLabel='Habilitaciones · '+eCamps.size+' campañas';
  document.getElementById('section-label-e').textContent=eLabel;
  document.getElementById('section-count-e').textContent=filterE().length+' registros';
  // Info campos
  document.getElementById('section-label-c').textContent='Información de campos';
  document.getElementById('section-count-c').textContent=filterC().length+' campos';
}

// Override renderG/E/C to also update section bars
var _origRenderG=renderG,_origRenderE=renderE,_origRenderC=renderC;
renderG=function(){_origRenderG();try{updateSectionBars();}catch(e){}};
renderE=function(){_origRenderE();try{updateSectionBars();}catch(e){}};
renderC=function(){_origRenderC();try{updateSectionBars();}catch(e){}};

// Override switchTab to update colors
var _origSwitch=switchTab;
switchTab=function(t){_origSwitch(t);};

// Override stat colors per tab
var _origStatCard=statCard;
